[package]
name = "kvlog"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Named abort points for tests/crash.rs; turned on for test builds by the dev-dependency below.
crash-points = []

[lints]
workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1.5"

[dev-dependencies]
fastrand = "2.5"
kvlog = { path = ".", features = ["crash-points"] }
