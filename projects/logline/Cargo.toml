[package]
name = "logline"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4.6", features = ["derive"] }
fastrand = "2.5"
flate2 = "1"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
